<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인생샷">
<title>인생샷 코치</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 첫 화면 -->
<section id="start" class="screen">
  <div class="start-inner">
    <p class="hello">인생샷 코치</p>
    <h1>누구를 찍을까요?</h1>

    <div class="pick">
      <button class="pick-card" data-mode="selfie">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="6" width="28" height="52" rx="6"/><circle cx="32" cy="27" r="8"/><path d="M21 46c2-7 7-10 11-10s9 3 11 10"/></svg>
        <span><b>내 얼굴 (셀카)</b><small>앞 카메라로 나를 찍어요</small></span>
      </button>
      <button class="pick-card" data-mode="half">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="20" r="9"/><path d="M14 58c0-14 8-24 18-24s18 10 18 24"/></svg>
        <span><b>다른 사람 · 상반신</b><small>얼굴과 허리 위까지</small></span>
      </button>
      <button class="pick-card" data-mode="full">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="9" r="5"/><path d="M24 30c0-8 4-13 8-13s8 5 8 13M27 30l-1 30M37 30l2 30M24 24l-4 12M40 24l4 12"/></svg>
        <span><b>다른 사람 · 전신</b><small>다리 길어 보이게 머리부터 발끝까지</small></span>
      </button>
    </div>
  </div>
</section>

<!-- 카메라 -->
<section id="cam" class="screen" hidden>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="frameGlow"></div>
    <div id="flash"></div>
  </div>

  <header class="top">
    <button id="backBtn" class="round" aria-label="처음으로">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span id="modeName" class="mode-name">셀카</span>
    <button id="settingsBtn" class="round" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <div class="bottom">
    <div id="card" class="card">
      <div id="cardIcon" class="card-icon"></div>
      <div class="card-text">
        <div id="cardMain" class="card-main">카메라 켜는 중…</div>
        <div id="cardSub" class="card-sub"></div>
      </div>
    </div>
    <div id="dots" class="dots" aria-hidden="true"></div>

    <div class="controls">
      <button id="galleryBtn" class="thumb" aria-label="찍은 사진"><img id="thumbImg" alt=""></button>
      <button id="shutter" class="shutter" aria-label="찍기"><span></span></button>
      <button id="flipBtn" class="round big" aria-label="카메라 바꾸기">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 13a8 8 0 0 0 14.5 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- 처음 한 번 사용법 -->
<div id="howto" class="sheet" hidden>
  <div class="sheet-card">
    <h2>이렇게 쓰면 돼요</h2>
    <ol class="howto">
      <li><i>1</i><span>화면 아래 <b>안내 한 줄</b>만 보세요</span></li>
      <li><i>2</i><span>말한 대로 <b>폰이나 몸을 조금씩</b> 움직여요</span></li>
      <li><i>3</i><span>화면이 <b class="g">초록색</b>이 되면 동그란 버튼을 눌러요</span></li>
    </ol>
    <button id="howtoOk" class="primary wide">알겠어요</button>
  </div>
</div>

<!-- 찍은 직후 -->
<div id="review" class="sheet dark" hidden>
  <div class="review">
    <img id="reviewImg" alt="방금 찍은 사진">
    <p id="reviewMsg" class="review-msg"></p>
    <div class="row2">
      <button id="retake" class="ghost">다시 찍기</button>
      <button id="saveBtn" class="primary">저장하기</button>
    </div>
  </div>
</div>

<!-- 찍은 사진들 -->
<div id="gallery" class="sheet" hidden>
  <div class="sheet-card tall">
    <h2>찍은 사진</h2>
    <div id="galleryGrid" class="grid"></div>
    <button id="closeGallery" class="primary wide">닫기</button>
  </div>
</div>

<!-- 설정 -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-card">
    <h2>설정</h2>
    <label class="opt"><span>목소리로 알려주기<small>남을 찍어줄 때 편해요</small></span><input type="checkbox" id="optVoice"></label>
    <label class="opt"><span>준비되면 자동으로 찍기</span><input type="checkbox" id="optAuto"></label>
    <label class="opt"><span>셀카를 거울처럼 저장</span><input type="checkbox" id="optMirror" checked></label>
    <label class="opt"><span>사진 모양</span>
      <select id="optRatio"><option value="3:4">세로 3:4</option><option value="4:5">인스타 4:5</option><option value="9:16">스토리 9:16</option><option value="1:1">정사각형</option></select>
    </label>
    <button id="showHowto" class="ghost wide">사용법 다시 보기</button>
    <button id="closeSettings" class="primary wide">닫기</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
