<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인생샷">
<title>인생샷 코치</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<!-- 첫 화면 -->
<section id="start" class="screen">
  <div class="start-inner">
    <p class="brand">인생샷 코치</p>
    <h1>어떤 사진을 찍을까요?</h1>
    <p class="lead">고르기만 하면 화면이 하나씩 알려주고<br>다 맞으면 초록색으로 바뀌어요.</p>

    <div class="pick">
      <button class="pick-card" data-mode="selfie">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><ellipse cx="40" cy="42" rx="17" ry="22" class="ghost"/><path d="M14 98c4-16 14-24 26-24s22 8 26 24" class="body"/></svg></span>
        <span class="txt"><b>셀카</b><small>위에서 살짝 내려다보는 각도</small></span>
      </button>
      <button class="pick-card" data-mode="half">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><ellipse cx="40" cy="30" rx="10" ry="13" class="ghost"/><path d="M12 98c2-30 14-48 28-48s26 18 28 48" class="body"/></svg></span>
        <span class="txt"><b>친구 상반신</b><small>카페·여행 인물 사진</small></span>
      </button>
      <button class="pick-card" data-mode="full">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><circle cx="40" cy="13" r="6" class="ghost"/><path d="M32 34c0-8 4-13 8-13s8 5 8 13v20M33 54l-2 39M47 54l3 39M32 30l-6 20M48 30l6 20" class="body"/><path d="M10 94h60" class="floor"/></svg></span>
        <span class="txt"><b>친구 전신</b><small>다리 길어 보이게</small></span>
      </button>
      <button class="pick-card" id="compCard">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><path d="M28 6v88M52 6v88M6 35h68M6 66h68" class="thin"/><circle cx="52" cy="35" r="6" class="ghost"/><path d="M45 94c1-26 3-40 7-40s6 14 7 40" class="body"/></svg></span>
        <span class="txt"><b>구도 골라 찍기</b><small>데이트·여행 사진 16가지 구도</small></span>
      </button>
    </div>
  </div>
</section>

<!-- 구도 고르기 -->
<section id="picker" class="screen" hidden>
  <header class="pk-top">
    <button id="pickerBack" class="pk-back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>구도 골라 찍기</h1>
  </header>
  <p class="pk-lead">찍고 싶은 구도를 고르면 화면에 선이 나와요.</p>
  <div id="compGrid" class="pk-grid"></div>
</section>

<!-- 카메라 -->
<section id="cam" class="screen" hidden>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <div id="glow"></div>
    <div id="flash"></div>
  </div>

  <header class="top">
    <button id="backBtn" class="round" aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <ol id="steps" class="steps">
      <li data-s="angle"><i></i>각도</li>
      <li data-s="pos"><i></i>위치</li>
      <li data-s="shot"><i></i>찰칵</li>
    </ol>
    <button id="compBtn" class="pill" hidden>구도</button>
    <button id="settingsBtn" class="round" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
  </header>

  <div id="levelBox" class="level big" hidden>
    <div class="level-ring"><span class="level-target"></span><span id="ball" class="ball"></span></div>
    <small>각도</small>
  </div>

  <button id="modeHint" class="mode-hint" hidden>공 → 원 → 초록이면 찰칵</button>

  <div id="compTag" class="comp-tag" hidden>
    <span id="compName"></span>
    <button id="dirBtn" class="dir-btn" hidden>걷는 방향 →</button>
  </div>

  <div class="bottom">
    <div id="say" class="say">
      <b id="sayMain">카메라 켜는 중…</b>
      <span id="saySub"></span>
      <button id="retryBtn" class="primary retry" hidden>다시 시도</button>
    </div>
    <div id="presets" class="seg" role="radiogroup" aria-label="뽀샵">
      <button role="radio" data-p="none">없음</button>
      <button role="radio" data-p="natural">살짝</button>
      <button role="radio" data-p="more">조금 더</button>
    </div>
    <div class="controls">
      <button id="galleryBtn" class="thumb" aria-label="찍은 사진"><img id="thumbImg" alt=""></button>
      <button id="shutter" class="shutter" aria-label="찍기" disabled><span></span></button>
      <button id="zoomBtn" class="zoom" aria-label="배율 1x" hidden>1x</button>
    </div>
  </div>
</section>

<!-- 처음 한 번: 사용법 -->
<div id="howto" class="sheet" hidden>
  <div class="sheet-card">
    <h2>3단계면 끝나요</h2>
    <div class="how">
      <div class="how-item">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" class="ring"/><circle cx="32" cy="32" r="8" class="tgt"/><circle cx="32" cy="32" r="5" class="ballg"/></svg>
        <p><b>1. 각도</b>폰을 기울여 노란 공을 가운데로</p>
      </div>
      <div class="how-item">
        <svg viewBox="0 0 64 64"><ellipse cx="32" cy="30" rx="15" ry="19" class="dash"/><ellipse cx="32" cy="30" rx="12" ry="16" class="live"/></svg>
        <p><b>2. 위치</b>노란 원을 점선 안에</p>
      </div>
      <div class="how-item">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" class="go"/><circle cx="32" cy="32" r="17" class="go-in"/></svg>
        <p><b>3. 찰칵</b>초록색이 되면 직접 눌러요</p>
      </div>
    </div>
    <button id="howtoOk" class="primary wide">시작하기</button>
  </div>
</div>

<!-- 찍은 직후 -->
<div id="review" class="sheet dark" hidden>
  <div class="review">
    <div class="review-photo">
      <img id="reviewImg" alt="방금 찍은 사진" draggable="false">
      <span id="origTag" class="orig-tag" hidden>원본</span>
    </div>
    <p id="compareHint" class="review-note" hidden>사진을 누르고 있으면 뽀샵 전 원본이 보여요</p>
    <p id="reviewHint" class="review-hint" aria-live="polite"></p>
    <div class="row2">
      <button id="retake" class="ghost">다시 찍기</button>
      <button id="saveBtn" class="primary">사진첩에 저장<small>다음 화면에서 '이미지 저장'</small></button>
    </div>
    <p class="review-note">저장 안 한 사진은 앱을 닫으면 사라져요</p>
  </div>
</div>

<!-- 찍은 사진들 -->
<div id="gallery" class="sheet" hidden>
  <div class="sheet-card tall">
    <h2>찍은 사진</h2>
    <div id="galleryGrid" class="grid"></div>
    <button id="closeGallery" class="primary wide">닫기</button>
  </div>
</div>

<!-- 설정 -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-card">
    <h2>설정</h2>
    <label class="opt"><span>목소리로 알려주기<small>화면을 못 볼 때 안내를 소리로 들려줘요</small></span><input type="checkbox" role="switch" id="optVoice"></label>
    <label class="opt"><span>셀카를 거울처럼 저장</span><input type="checkbox" role="switch" id="optMirror"></label>
    <label class="opt"><span>사진 모양</span>
      <select id="optRatio"><option value="3:4">세로 3:4</option><option value="4:5">인스타 4:5</option><option value="9:16">스토리 9:16</option></select>
    </label>
    <button id="showHowto" class="ghost wide">사용법 다시 보기</button>
    <button id="closeSettings" class="primary wide">닫기</button>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<div class="turn" aria-hidden="true">폰을 세로로 돌려주세요</div>

<script type="module" src="app.js?v=11"></script>
</body>
</html>
