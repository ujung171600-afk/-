<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인생샷">
<title>인생샷 코치</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<!-- 첫 화면 -->
<section id="start" class="screen">
  <div class="start-inner">
    <p class="brand">인생샷 코치</p>
    <h1>어떤 사진을 찍을까요?</h1>
    <p class="lead">고르기만 하면 화면이 하나씩 알려주고<br>다 맞으면 초록색으로 바뀌어요.</p>

    <div class="pick">
      <button class="pick-card" data-mode="selfie">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><ellipse cx="40" cy="42" rx="17" ry="22" class="ghost"/><path d="M14 98c4-16 14-24 26-24s22 8 26 24" class="body"/></svg></span>
        <span class="txt"><b>셀카</b><small>얼굴은 작고 갸름하게</small></span>
      </button>
      <button class="pick-card" data-mode="half">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><ellipse cx="40" cy="30" rx="10" ry="13" class="ghost"/><path d="M12 98c2-30 14-48 28-48s26 18 28 48" class="body"/></svg></span>
        <span class="txt"><b>친구 상반신</b><small>카페·여행 인물 사진</small></span>
      </button>
      <button class="pick-card" data-mode="full">
        <span class="pic"><svg viewBox="0 0 80 100"><rect x="2" y="2" width="76" height="96" rx="10" class="frame"/><circle cx="40" cy="13" r="6" class="ghost"/><path d="M32 34c0-8 4-13 8-13s8 5 8 13v20M33 54l-2 39M47 54l3 39M32 30l-6 20M48 30l6 20" class="body"/><path d="M10 94h60" class="floor"/></svg></span>
        <span class="txt"><b>친구 전신</b><small>다리 길어 보이게</small></span>
      </button>
    </div>
    <p class="ver">버전 7</p>
  </div>
</section>

<!-- 카메라 -->
<section id="cam" class="screen" hidden>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <div id="glow"></div>
    <div id="flash"></div>
  </div>

  <header class="top">
    <button id="backBtn" class="round" aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <ol id="steps" class="steps">
      <li data-s="angle"><i></i>각도</li>
      <li data-s="pos"><i></i>위치</li>
      <li data-s="shot"><i></i>찰칵</li>
    </ol>
    <button id="settingsBtn" class="round" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
  </header>

  <div id="levelBox" class="level" hidden>
    <div class="level-ring"><span class="level-target"></span><span id="ball" class="ball"></span></div>
    <small>공을 가운데로</small>
  </div>

  <div class="bottom">
    <div id="say" class="say">
      <b id="sayMain">카메라 켜는 중…</b>
      <span id="saySub"></span>
    </div>
    <button id="beautyBtn" class="chip">뽀샵 <b id="beautyName">피부결 정돈</b></button>
    <div class="controls">
      <button id="galleryBtn" class="thumb" aria-label="찍은 사진"><img id="thumbImg" alt=""></button>
      <button id="shutter" class="shutter" aria-label="찍기"><span></span></button>
      <button id="flipBtn" class="round big" aria-label="카메라 바꾸기"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 13a8 8 0 0 0 14.5 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/></svg></button>
    </div>
  </div>
</section>

<!-- 처음 한 번: 사용법 -->
<div id="howto" class="sheet" hidden>
  <div class="sheet-card">
    <h2>3단계면 끝나요</h2>
    <div class="how">
      <div class="how-item">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" class="ring"/><circle cx="32" cy="32" r="8" class="tgt"/><circle cx="32" cy="32" r="5" class="ballg"/></svg>
        <p><b>1. 각도</b>폰을 기울여 공을 가운데로</p>
      </div>
      <div class="how-item">
        <svg viewBox="0 0 64 64"><ellipse cx="32" cy="30" rx="15" ry="19" class="dash"/><ellipse cx="32" cy="30" rx="12" ry="16" class="live"/></svg>
        <p><b>2. 위치</b>얼굴을 점선 안에</p>
      </div>
      <div class="how-item">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" class="go"/><circle cx="32" cy="32" r="17" fill="#fff"/></svg>
        <p><b>3. 찰칵</b>초록색이 되면 셔터를 눌러요</p>
      </div>
    </div>
    <button id="howtoOk" class="primary wide">시작하기</button>
  </div>
</div>

<!-- 뽀샵 -->
<div id="beauty" class="sheet clear" hidden>
  <div class="sheet-card">
    <h2>뽀샵</h2>
    <p class="note">얼굴 모양은 그대로 두고 피부결과 혈색만 살짝 정돈해요</p>
    <div id="presets" class="presets">
      <button data-p="none">없음</button>
      <button data-p="natural">피부결 정돈</button>
      <button data-p="more">조금 더</button>
    </div>
    <button id="closeBeauty" class="primary wide">완료</button>
  </div>
</div>

<!-- 찍은 직후 -->
<div id="review" class="sheet dark" hidden>
  <div class="review">
    <img id="reviewImg" alt="방금 찍은 사진">
    <div class="row2">
      <button id="retake" class="ghost">다시 찍기</button>
      <button id="saveBtn" class="primary">사진첩에 저장</button>
    </div>
  </div>
</div>

<!-- 찍은 사진들 -->
<div id="gallery" class="sheet" hidden>
  <div class="sheet-card tall">
    <h2>찍은 사진</h2>
    <div id="galleryGrid" class="grid"></div>
    <button id="closeGallery" class="primary wide">닫기</button>
  </div>
</div>

<!-- 설정 -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-card">
    <h2>설정</h2>
    <label class="opt"><span>목소리로 알려주기<small>친구를 찍어줄 때 편해요</small></span><input type="checkbox" id="optVoice"></label>
    <label class="opt"><span>셀카를 거울처럼 저장</span><input type="checkbox" id="optMirror"></label>
    <label class="opt"><span>사진 모양</span>
      <select id="optRatio"><option value="3:4">세로 3:4</option><option value="4:5">인스타 4:5</option><option value="9:16">스토리 9:16</option></select>
    </label>
    <button id="showHowto" class="ghost wide">사용법 다시 보기</button>
    <button id="closeSettings" class="primary wide">닫기</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=7"></script>
</body>
</html>
